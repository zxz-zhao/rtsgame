version: '3.8'

services:
  rocketchat-mongo:
    image: mongo:5.0
    container_name: rocketchat-mongo
    restart: unless-stopped
    volumes:
      - rocketchat_db_data:/data/db
    command: mongod --oplogSize 128 --replSet rs0 --storageEngine wiredTiger --setParameter maxNumActiveUserIndexBuilds=50
    ports:
      - "27017:27017"

  rocketchat-mongo-init-replica:
    image: mongo:5.0
    container_name: rocketchat-mongo-init-replica
    restart: "no"
    command: >
      bash -c "for i in $$(seq 1 30); do
        mongo rocketchat-mongo:27017/rocketchat --eval \"rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'rocketchat-mongo:27017'}]})\" && echo 'Replica set initiated' && break || sleep 2;
      done"
    depends_on:
      - rocketchat-mongo

  rocketchat:
    image: rocketchat/rocket.chat:6.13.0
    container_name: rocketchat
    restart: unless-stopped
    environment:
      - MONGO_URL=mongodb://rocketchat-mongo:27017/rocketchat?replicaSet=rs0
      - MONGO_OPLOG_URL=mongodb://rocketchat-mongo:27017/local?replicaSet=rs0
      - ROOT_URL=https://shmtp-2409-8a0c-9c45-2f90-b5ad-8fd0-30fe-2747.free.pinggy.net
      - PORT=3000
      - DEPLOY_METHOD=docker
      - Accounts_UseDNSDomainCheck=false
    ports:
      - "3001:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - rocketchat-mongo

volumes:
  rocketchat_db_data:
