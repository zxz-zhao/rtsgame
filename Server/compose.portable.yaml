services:
  unity-rts-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: unity-rts-server:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-8080}:8080"
      - "${WS_PORT:-8081}:8081"
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups

# Portable deployment recommendation:
# - Keep MySQL on a separate managed database or another host.
# - Point MYSQL_HOST in .env to that external database.
# - Then you can recreate this app container on any server without losing player data.
