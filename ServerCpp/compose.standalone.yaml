# ========================================================
# UnityRTS C++ Native Server - Zero-Dependency Standalone Mode
# ========================================================
name: unity-rts-cpp-standalone

services:
  rts-server-cpp:
    build:
      context: .
      dockerfile: Dockerfile
    image: unity-rts-server-cpp:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BIND_HOST: 0.0.0.0
      PORT: 8080
      WS_PORT: 8081
      JWT_SECRET: ${JWT_SECRET:-unityrts-super-secret-key-32chars-min!}
      ADMIN_API_SECRET: ${ADMIN_API_SECRET:-admin-secret-replace-me-securely}
      MYSQL_ENABLED: "false"
      REDIS_ENABLED: "false"
      STRICT_STORAGE_BACKENDS: "false"
    ports:
      - "${PORT:-8080}:8080"
      - "${WS_PORT:-8081}:8081"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./backups:/app/backups
